# Code analysis: use SonarCloud (free cloud) OR self-hosted SonarQube.
# - SonarCloud: set in .env → SONAR_HOST_URL=https://sonarcloud.io, SONAR_ORGANIZATION=<org>, SONAR_TOKEN=<token>, SONAR_PROJECT_KEY=<key>
#   No need to start the sonarqube service below.
# - Self-hosted: run with profile → docker-compose --profile self-hosted-sonar up -d
#   Then set SONAR_HOST_URL=http://sonarqube:9000 and SONAR_TOKEN in .env.

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    profiles:
      - self-hosted-sonar
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    platform: "linux/amd64"
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data/gitops_repos:/tmp/gitops_repos
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    environment:
      - PYTHONUNBUFFERED=1
      # Code analysis: set in .env (SonarCloud or self-hosted)
      # SonarCloud (free): SONAR_HOST_URL=https://sonarcloud.io, SONAR_ORGANIZATION=<org>, SONAR_TOKEN=..., SONAR_PROJECT_KEY=...
      # Self-hosted: SONAR_HOST_URL=http://sonarqube:9000, SONAR_TOKEN=... (run with --profile self-hosted-sonar)

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

